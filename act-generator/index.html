<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACT Generator — Infinity ®</title><link rel="stylesheet" href="styles.css"></head>
<body><main>
<header><p>Infinity ® 2026</p><h1>ACT Generator</h1><p>Create a fifteen-second audiovisual card.</p></header>
<section class="grid">
<div class="panel"><h2>1. Add clip</h2><input id="videoUpload" type="file" accept="video/*"><label>Internet Archive video search<input id="videoQuery"><button data-search="video">Search video</button></label><div id="videoResults" class="results"></div></div>
<div class="panel"><h2>2. Add song</h2><input id="audioUpload" type="file" accept="audio/*"><label>Internet Archive song search<input id="audioQuery"><button data-search="audio">Search song</button></label><div id="audioResults" class="results"></div></div>
</section>
<section class="panel editor"><h2>3. Choose the ACT</h2><video id="video" controls playsinline></video><audio id="audio" preload="metadata"></audio>
<div class="trim"><label>Start <input id="start" type="range" min="0" max="0" value="0" step=".1"><output id="startOut">0.0s</output></label><label>End <input id="end" type="range" min="0" max="15" value="15" step=".1"><output id="endOut">15.0s</output></label></div>
<label>Music beneath dialogue <input id="mix" type="range" min="0" max="1" value=".28" step=".01"><output id="mixOut">28%</output></label>
<div class="actions"><button id="preview">Preview ACT</button><button id="download">Download manifest</button></div><p id="status" role="status"></p></section>
<section class="panel"><h2>Rights gate</h2><label><input id="rights" type="checkbox"> I verified that these sources may be used for this ACT.</label><p>Preview is available for editing. Production export remains locked until rights verification.</p></section>
</main><script src="app.js"></script></body></html>
